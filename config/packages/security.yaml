security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser:
            algorithm: bcrypt
        App\Entity\User:
            algorithm: bcrypt

    providers:
        chain_provider:
            chain:
                providers: [in_memory, portal_user_provider]

        in_memory:
            memory:
                users:
                    superadmin@system.com:
                        # Hashed version of admin1234
                        password: '$2y$13$V3kcSFildW.R69cnzm3m0eqmNbqpoPvNcWnCbRNwrGQrFYXUMfJcu'
                        roles: ['ROLE_SUPER_ADMIN', 'ROLE_USER']

        portal_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            provider: chain_provider

            form_login:
                username_parameter: 'email'
                password_parameter: 'password'
                check_path: app_login
                login_path: app_login
                success_handler: App\Security\AuthenticationSuccessHandler
#                default_target_path: app_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login

            user_checker: App\Service\UserChecker
            # Add this if you're using remember me functionality
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds
                path: /
                remember_me_parameter: 'remember_me'

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/dashboard/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/dashboard/merchant, roles: ROLE_USER }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/merchant/, roles: ROLE_USER }
        - { path: ^/financials, roles: ROLE_USER }
        - { path: ^/commission, roles: ROLE_USER }
        - { path: ^/limits, roles: ROLE_USER }
        - { path: ^/reports, roles: ROLE_USER }
        - { path: ^/help, roles: ROLE_USER }
        - { path: ^/settings, roles: ROLE_USER }
        - { path: ^/profile, roles: ROLE_USER }

