    methods: POST

merchant_document_counts:
    path: /merchant/{id}/document-counts
    controller: App\Controller\LimitsAndDocs\DocumentUploadController::getDocumentCounts
    methods: GET

view_merchant_document:
    path: /merchant/{id}/documents/{type}/{filename}
    controller: App\Controller\LimitsAndDocs\DocumentUploadController::viewDocument
    methods: GET

