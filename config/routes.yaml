# config/routes.yaml

# Login page route
app_login:
    path: /login
    controller: App\Controller\SecurityController::login

app_logout:
    path: /logout

app_merchant_index:
    path: /admin/merchant
    controller: App\Controller\SuperAdmin\MerchantController::index
    methods: GET

# Main dashboard route
app_dashboard:
    path: /dashboard
    controller: App\Controller\DashboardController::index
    methods: GET

app_merchant_selection:
    path: /dashboard/select-merchant/{id}
    controller: App\Controller\DashboardController::selectMerchant
    methods: GET

# Redirect root to dashboard
app_home:
    path: /
    controller: App\Controller\DashboardController::home
    methods: GET

#Redirect to Merchant Details
merchant_show:
    path: /details/{id}
    controller: App\Controller\MerchantController::details
    methods: GET

portal_users:
    path: /portal_users/{id}
    controller: App\Controller\PortalUser\PortalUserController::portalUsers
    methods: GET

portal_users_status:
    path: /merchant/edit_user/{id}/{userId}
    controller: App\Controller\PortalUser\PortalUserController::editUser
    methods: [GET, POST]

add_user:
    path: /merchant/portal_users/{id}
    controller: App\Controller\UserController:addUser
    methods: POST

view_user:
    path: /merchant/{id}/user/{userId}
    controller: App\Controller\UserController::view
    methods: GET

edit_user:
    path: /merchant/{id}/user/{userId}
    controller: App\Controller\UserController::edit
    methods: [GET, POST]

delete_user:
    path: /merchant/{id}/user/{userId}
    controller: App\Controller\UserController:delete
    methods: POST

outlets:
    path: /outlets/{id}
    controller: App\Controller\PortalUser\OutletController:outlets
    methods: GET

